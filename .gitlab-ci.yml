stages:
  - build
  - codestyle
  - integration_tests
build:
  stage: build
  script:
    - echo "=== Building s21_cat ==="
    - cd "$CI_PROJECT_DIR/src/C2_SimpleBashUtils_ID_353513-1-develop/src/cat"
    - make clean
    - make

    - echo "=== Building s21_grep ==="
    - cd "$CI_PROJECT_DIR/src/C2_SimpleBashUtils_ID_353513-1-develop/src/grep"
    - make clean
    - make

    - echo "=== Preparing artifacts ==="
    - mkdir -p "$CI_PROJECT_DIR/src/artifacts"
    - cp "$CI_PROJECT_DIR/src/C2_SimpleBashUtils_ID_353513-1-develop/src/cat/s21_cat" "$CI_PROJECT_DIR/src/artifacts/"
    - cp "$CI_PROJECT_DIR/src/C2_SimpleBashUtils_ID_353513-1-develop/src/grep/s21_grep" "$CI_PROJECT_DIR/src/artifacts/"
    - ls -lah "$CI_PROJECT_DIR/src/artifacts"

  artifacts:
    paths:
      - src/artifacts/
    expire_in: 30 days

codestyle:
  stage: codestyle
  script:
    - echo "=== clang-format version ==="
    - clang-format --version

    - echo "=== Checking s21_cat ==="
    - clang-format --dry-run --Werror --style=file src/C2_SimpleBashUtils_ID_353513-1-develop/src/cat/*.c src/C2_SimpleBashUtils_ID_353513-1-develop/src/cat/*.h

    - echo "=== Checking s21_grep ==="
    - clang-format --dry-run --Werror --style=file src/C2_SimpleBashUtils_ID_353513-1-develop/src/grep/*.c src/C2_SimpleBashUtils_ID_353513-1-develop/src/grep/*.h

    - echo "=== Codestyle check passed ==="
  
integration_tests:
  stage: integration_tests
  script:
    - echo "=== Starting integration tests ==="
    - chmod +x src/integration_tests.sh
    - src/integration_tests.sh